server {
    listen 80;
    listen [::]:80;
    # nip.io 호스트네임을 포함시켜야 certbot --nginx 가 server block 을 찾는다.
    # 신규 IP 로 재프로비저닝 시 144-24-79-213 자리만 갈아끼우면 됨.
    server_name 168-107-46-23.nip.io 168.107.46.23 _;

    client_max_body_size 1m;

    access_log /var/log/nginx/kcis.access.log;
    error_log  /var/log/nginx/kcis.error.log;

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 200 'KCIS API server. See /health or /api/*.\n';
        add_header Content-Type text/plain;
    }
}
